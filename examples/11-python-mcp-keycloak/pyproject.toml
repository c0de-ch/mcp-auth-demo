[project]
name = "mcp-auth-demo-11-python-mcp-keycloak"
version = "0.1.0"
description = "11 - Python twin of example 04: Keycloak as AS, `mcp` (Python SDK) resource server with PRM + JWKS validation"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.1.1",
    "PyJWT[crypto]>=2.9",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
